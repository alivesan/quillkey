<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
  <title>QuillKey dictation</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}body{display:flex;align-items:flex-end;justify-content:center;padding:4px;font-family:'Segoe UI',sans-serif;color:#f1fff7;user-select:none}
    .widget{position:relative;display:flex;align-items:center;width:56px;height:40px;flex:none;overflow:hidden;border:1px solid #b8ebcf52;border-radius:22px;background:linear-gradient(145deg,#20392f,#10251e);box-shadow:0 2px 4px #0004;transition:background .16s,border-color .16s}
    .widget.expanded{width:312px;height:88px;border-radius:24px}.widget:hover{border-color:#b8ebcf94}.widget[data-phase="recording"]{background:linear-gradient(145deg,#234a38,#123024);border-color:#9be9b97a}.widget[data-phase="error"]{border-color:#ecab807a}
    button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-app-region:no-drag}button:focus-visible{outline:2px solid #d0ffe1;outline-offset:-4px}button:disabled{cursor:wait}
    .toggle{position:relative;display:flex;align-items:center;gap:13px;width:100%;height:100%;padding:0 15px;background:transparent;text-align:left;border-radius:inherit}.expanded .toggle{padding:0 18px; padding-right:52px}
    .mic-wrap{position:relative;display:flex;align-items:center;justify-content:center;width:24px;height:28px;flex:none}.mic{width:21px;height:24px;fill:none;stroke:#d4f4df;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.dot{position:absolute;right:-3px;bottom:0;width:6px;height:6px;border-radius:50%;background:#94e8ab;box-shadow:0 0 0 2px #183025}
    .copy{display:none;min-width:0}.expanded .copy{display:block}.title{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px;font-weight:650;letter-spacing:.1px;line-height:20px}.detail{display:block;color:#b9d1c4;font-size:11px;line-height:16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .cancel{display:none;position:absolute;right:12px;top:28px;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:#ffffff0d;color:#bcd6c7;font-size:21px;font-weight:300;line-height:1}.cancel:hover{background:#ffffff20;color:#fff}.expanded .cancel.available{display:flex}
    .wave{display:none;align-items:center;gap:2px;height:22px}.wave span{width:3px;height:7px;border-radius:3px;background:#b6f5c6;animation:listen .8s ease-in-out infinite alternate}.wave span:nth-child(2){height:16px;animation-delay:-.4s}.wave span:nth-child(3){height:22px;animation-delay:-.2s}.wave span:nth-child(4){height:12px;animation-delay:-.6s}.widget[data-phase="recording"] .mic{display:none}.widget[data-phase="recording"] .wave{display:flex}.widget[data-phase="recording"] .dot{display:none}.widget[data-phase="connecting"] .dot,.widget[data-phase="processing"] .dot{background:#e5ce89}.widget[data-phase="error"] .dot{background:#edaf88}
    @keyframes listen{to{transform:scaleY(.35);opacity:.65}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main id="widget" class="widget" data-phase="idle" aria-label="QuillKey dictation">
    <button id="toggle" class="toggle" type="button" aria-label="Start dictation" title="Click to dictate · Hold Ctrl + Alt + Space">
      <span class="mic-wrap" aria-hidden="true"><svg class="mic" viewBox="0 0 24 28"><rect x="8" y="2" width="8" height="15" rx="4"/><path d="M4 12v2a8 8 0 0 0 16 0v-2M12 22v4M8 26h8"/></svg><span class="wave"><span></span><span></span><span></span><span></span></span><span class="dot"></span></span>
      <span class="copy" aria-live="polite" aria-atomic="true"><span id="title" class="title">QuillKey</span><span id="detail" class="detail">Click to dictate</span></span>
    </button>
    <button id="cancel" class="cancel" type="button" aria-label="Cancel dictation" title="Cancel dictation" disabled>×</button>
  </main>
  <script src="overlay.js"></script>
</body>
</html>
